<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graduación Estrategias Comerciales 2.0</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

<style>
html,body{margin:0}

:root{
  --ink:#0a0a0b;
  --coal:#17171a;
  --coal-2:#222226;
  --red:#e3121c;
  --red-deep:#8f0b12;
  --bone:#f4f0ea;
  --mute:#a6a29c;
  --display:"Syne","Arial Black",Impact,sans-serif;
  --body:"Manrope","Helvetica Neue",Arial,sans-serif;
  --w:min(92vw,420px,calc(100svh - 190px));
  color-scheme:dark;
}

*{
  box-sizing:border-box;
}

html,body{
  height:100%;
}

body{
  background:var(--ink);
  color:var(--bone);
  font-family:var(--body);
  padding-inline:16px;
  overflow-x:hidden;
}

.scene{
  position:relative;
  min-height:100svh;
  display:grid;
  place-items:center;
  overflow:hidden;
  isolation:isolate;
}

.scene::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  background:
    radial-gradient(
      60% 45% at 50% 55%,
      rgba(227,18,28,.16),
      transparent 70%
    ),
    linear-gradient(var(--ink),#0e0e10);
}

.eyebrow{
  position:absolute;
  top:7svh;
  left:0;
  right:0;
  text-align:center;
  font:700 .72rem/1 var(--body);
  letter-spacing:.32em;
  text-transform:uppercase;
  color:var(--mute);
  transition:opacity .5s;
}

.eyebrow b{
  color:var(--red);
  font-weight:700;
}

.hint{
  position:absolute;
  bottom:9svh;
  left:0;
  right:0;
  text-align:center;
  font:500 .95rem/1.3 var(--body);
  color:var(--bone);
  transition:opacity .5s;
}

.hint small{
  display:block;
  margin-top:.4rem;
  color:var(--mute);
  font-size:.78rem;
}


/* =========================
   SOBRE
========================= */

.envelope{
  position:relative;
  width:calc(var(--w)*.9);
  height:calc(var(--w)*.6);
  transition:
    transform 1s cubic-bezier(.6,0,.2,1),
    opacity .8s;
  perspective:1200px;
}

.back{
  position:absolute;
  inset:0;
  background:var(--coal-2);
  border-radius:6px;
  box-shadow:
    0 30px 60px -20px rgba(0,0,0,.9),
    0 0 0 1px rgba(255,255,255,.05);
}

.clip{
  position:absolute;
  inset:0;
  z-index:2;
  clip-path:inset(0 -2% 0 -2%);
  transition:clip-path .9s ease;
}

.pocket{
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
  border-radius:6px;
  overflow:hidden;
}

.pocket i{
  position:absolute;
  inset:0;
  display:block;
}

.pocket .l{
  background:linear-gradient(100deg,#1c1c20,#141417);
  clip-path:polygon(0 0,52% 52%,0 100%);
}

.pocket .r{
  background:linear-gradient(260deg,#1f1f23,#151518);
  clip-path:polygon(100% 0,48% 52%,100% 100%);
}

.pocket .b{
  background:linear-gradient(0deg,#101012,#1a1a1e);
  clip-path:polygon(0 100%,50% 48%,100% 100%);
}

.pocket::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:3px;
  background:var(--red);
}

.flap{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:56%;
  z-index:4;
  transform-origin:50% 0;
  transform-style:preserve-3d;
  transition:
    transform .8s cubic-bezier(.5,0,.2,1),
    z-index 0s .35s;
}

.flap i{
  position:absolute;
  inset:0;
  clip-path:polygon(0 0,100% 0,50% 100%);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}

.flap .f{
  background:linear-gradient(180deg,#26262b,#1b1b1f);
}

.flap .bk{
  background:linear-gradient(180deg,var(--red),var(--red-deep));
  transform:rotateX(180deg);
}

.seal{
  position:absolute;
  z-index:5;
  left:50%;
  top:56%;
  width:calc(var(--w)*.2);
  aspect-ratio:1;
  translate:-50% -50%;
  border-radius:50%;
  border:0;
  cursor:pointer;
  background:
    radial-gradient(
      circle at 35% 30%,
      #ff3a43,
      var(--red) 55%,
      var(--red-deep)
    );
  color:#fff;
  display:grid;
  place-content:center;
  text-align:center;
  font-family:var(--display);
  font-weight:800;
  line-height:.95;
  box-shadow:
    0 6px 18px rgba(0,0,0,.6),
    inset 0 0 0 2px rgba(255,255,255,.18);
  transition:
    opacity .3s,
    scale .3s;
}

.seal b{
  display:block;
  font-size:calc(var(--w)*.075);
}

.seal span{
  display:block;
  font-size:calc(var(--w)*.032);
  letter-spacing:.14em;
  margin-top:.15em;
}

.seal::before{
  content:"";
  position:absolute;
  inset:-6px;
  border-radius:50%;
  border:2px solid var(--red);
  animation:pulse 2s ease-out infinite;
}

.seal:hover{
  scale:1.06;
}

.seal:focus-visible{
  outline:3px solid var(--bone);
  outline-offset:6px;
}

@keyframes pulse{
  0%{
    transform:scale(.9);
    opacity:.9;
  }

  100%{
    transform:scale(1.5);
    opacity:0;
  }
}


/* =========================
   CARTA
========================= */

.card{
  position:absolute;
  left:50%;
  bottom:6px;
  width:var(--w);
  height:var(--w);
  margin-left:calc(var(--w)/-2);

  /*
     IMPORTANTE:
     Se conserva la transformación original
     para evitar que la tarjeta desaparezca
     durante la animación.
  */
  transform-origin:50% 100%;
  transform:translateY(0) scale(.64);

  overflow:hidden;
  background:var(--ink);
  border-radius:calc(var(--w)*.025);

  box-shadow:
    0 0 0 1px rgba(255,255,255,.08),
    0 30px 80px -20px rgba(0,0,0,.9);

  transition:
    transform 1s cubic-bezier(.5,0,.15,1);
}

.card img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}


/* =========================
   ESTADOS
========================= */

.open .flap{
  transform:rotateX(180deg);
  z-index:0;
}

.open .seal{
  opacity:0;
  pointer-events:none;
}

.open .eyebrow,
.open .hint{
  opacity:0;
}

/*
   NO modificar estos valores.
   Son los responsables de que la
   tarjeta salga correctamente.
*/
.rise .clip{
  clip-path:inset(-300% -60% 0 -60%);
}

.rise .card{
  transform:translateY(calc(var(--w)*-.42)) scale(.64);
}

.reveal .clip{
  clip-path:none;
  z-index:6;
}

.reveal .envelope{
  transform:translateY(60svh);
  pointer-events:none;
}

.back,
.pocket{
  transition:opacity .6s;
}

.reveal .back,
.reveal .pocket,
.reveal .flap{
  opacity:0;
}

.reveal .card{
  transform:translateY(calc(var(--w)*.2 - 60svh)) scale(1);
}

.after{
  position:absolute;
  left:0;
  right:0;
  bottom:2.2svh;

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:.5rem;

  opacity:0;
  pointer-events:none;

  transition:opacity .6s .9s;
  z-index:7;
}

.reveal .after{
  opacity:1;
  pointer-events:auto;
}

.count{
  font:500 .85rem/1 var(--body);
  color:var(--mute);
  font-variant-numeric:tabular-nums;
}

.count b{
  color:var(--bone);
  font-weight:700;
}

.close{
  background:none;
  border:1px solid rgba(255,255,255,.25);
  color:var(--bone);
  font:500 .8rem/1 var(--body);
  padding:.6rem 1rem;
  border-radius:99px;
  cursor:pointer;
}

.close:hover{
  border-color:var(--red);
}

.close:focus-visible{
  outline:2px solid var(--red);
  outline-offset:3px;
}


/* =========================
   EFECTOS
========================= */

.fx{
  position:absolute;
  left:0;
  top:0;
  width:0;
  height:0;
  z-index:9;
  pointer-events:none;
}

.fx i{
  position:absolute;
  left:0;
  top:0;
  display:block;
  will-change:transform,opacity;
}

.fx .st{
  background:var(--c,#fff);
  clip-path:
    polygon(
      50% 0,
      60% 40%,
      100% 50%,
      60% 60%,
      50% 100%,
      40% 60%,
      0 50%,
      40% 40%
    );
  filter:drop-shadow(0 0 4px var(--c,#fff));
}

.fx .rg{
  border:2px solid var(--red);
  border-radius:50%;
  box-shadow:
    0 0 18px rgba(227,18,28,.7),
    inset 0 0 14px rgba(227,18,28,.5);
}

.fx .fl{
  border-radius:50%;
  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.95),
      rgba(255,70,80,.55) 35%,
      transparent 70%
    );
}

.rays{
  position:absolute;
  left:50%;
  top:50%;
  width:min(190vw,1200px);
  aspect-ratio:1;
  translate:-50% -50%;
  pointer-events:none;
  opacity:0;

  transition:opacity 1.2s .6s;

  background:
    repeating-conic-gradient(
      from 0deg,
      rgba(255,70,80,.42) 0 5deg,
      transparent 5deg 16deg
    );

  -webkit-mask-image:
    radial-gradient(
      circle,
      #000 8%,
      transparent 66%
    );

  mask-image:
    radial-gradient(
      circle,
      #000 8%,
      transparent 66%
    );

  /*
     Un poco más lento para reducir uso de CPU/GPU,
     pero visualmente conserva el efecto.
  */
  animation:giro 55s linear infinite;
}

.reveal .rays{
  opacity:1;
}

@keyframes giro{
  to{
    transform:rotate(360deg);
  }
}

.flash{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:8;
  opacity:0;

  background:
    radial-gradient(
      circle at 50% 56%,
      rgba(255,255,255,.95),
      rgba(255,60,70,.5) 40%,
      transparent 75%
    );
}

.fx .tw{
  background:#fff;

  clip-path:
    polygon(
      50% 0,
      58% 42%,
      100% 50%,
      58% 58%,
      50% 100%,
      42% 58%,
      0 50%,
      42% 42%
    );

  filter:
    drop-shadow(0 0 6px #fff)
    drop-shadow(0 0 12px #ff3a43);
}


/* =========================
   BRILLO DE LA CARTA
========================= */

.card::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  transform:translateX(-130%);

  background:
    linear-gradient(
      105deg,
      transparent 36%,
      rgba(255,255,255,.85) 50%,
      transparent 64%
    );

  mix-blend-mode:screen;
}

.reveal .card::after{
  animation:sweep 3.6s .85s ease-in-out infinite;
}

.reveal .card{
  animation:
    glow 2.4s .9s ease-out both,
    pulso 2.6s 3.3s ease-in-out infinite;
}

@keyframes sweep{
  0%{
    transform:translateX(-130%);
  }

  38%,100%{
    transform:translateX(130%);
  }
}

@keyframes glow{
  0%{
    box-shadow:
      0 0 0 1px rgba(255,255,255,.08),
      0 30px 80px -20px rgba(0,0,0,.9);
  }

  35%{
    box-shadow:
      0 0 0 2px rgba(255,255,255,.5),
      0 0 120px 28px rgba(227,18,28,.85);
  }

  100%{
    box-shadow:
      0 0 0 1px rgba(255,255,255,.12),
      0 0 60px 6px rgba(227,18,28,.35);
  }
}

@keyframes pulso{
  0%,100%{
    box-shadow:
      0 0 0 1px rgba(255,255,255,.12),
      0 0 60px 6px rgba(227,18,28,.35);
  }

  50%{
    box-shadow:
      0 0 0 1px rgba(255,255,255,.3),
      0 0 110px 22px rgba(227,18,28,.6);
  }
}


/* =========================
   REDUCIR MOVIMIENTO
========================= */

@media (prefers-reduced-motion:reduce){

  .reveal .card,
  .reveal .card::after{
    animation:none;
  }

  .fx,
  .flash,
  .rays{
    display:none;
  }

  .flap,
  .clip,
  .card,
  .envelope,
  .after,
  .eyebrow,
  .hint{
    transition-duration:.01s!important;
    transition-delay:0s!important;
  }

  .seal::before{
    animation:none;
  }
}
</style>
</head>


<body>

<main class="scene" id="scene">

  <p class="eyebrow">
    Desarrollo <b>Organizacionl</b> te invita
  </p>

  <div class="rays" aria-hidden="true"></div>

  <div class="envelope" id="envelope">

    <div class="back"></div>

    <div class="clip">

      <article class="card">
        <img
          src="invitacion.jpeg"
          alt="Invitación: Más que clientes, construimos confianza. Graduación de Fuerza Comercial Efectiva, Estrategias Comerciales 2.0. 29 de octubre, 10h00, Hotel Dann Carlton, Quito."
        >
      </article>

    </div>

    <div class="pocket" aria-hidden="true">
      <i class="l"></i>
      <i class="r"></i>
      <i class="b"></i>
    </div>

    <div class="flap" aria-hidden="true">
      <i class="f"></i>
      <i class="bk"></i>
    </div>

    <button
      class="seal"
      id="seal"
      type="button"
      aria-label="Abrir la invitación"
    >
      <b>29</b>
      <span>OCT</span>
    </button>

  </div>


  <p class="hint">
    Toca el sello para abrir
    <small>Graduación · Estrategias Comerciales 2.0</small>
  </p>


  <div
    class="flash"
    id="flash"
    aria-hidden="true"
  ></div>

  <div
    class="fx"
    id="fx"
    aria-hidden="true"
  ></div>


  <div class="after">

    <span
      class="count"
      id="count"
    ></span>

    <button
      class="close"
      id="close"
      type="button"
    >
      Cerrar la carta
    </button>

  </div>

</main>


<script>
(function(){

  /* =========================
     ELEMENTOS
  ========================= */

  var scene = document.getElementById('scene');
  var seal = document.getElementById('seal');
  var envelope = document.getElementById('envelope');
  var card = document.querySelector('.card');
  var flashElement = document.getElementById('flash');
  var fx = document.getElementById('fx');
  var closeButton = document.getElementById('close');

  var timers = [];

  var reduce =
    window.matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches;

  var timerTw = null;
  var sparkleAnimationCount = 0;

  var colores = [
    '#ffffff',
    '#ff3a43',
    '#e3121c',
    '#ffd9c9'
  ];


  /* =========================
     TIMER
  ========================= */

  function later(fn, ms){
    timers.push(
      setTimeout(
        fn,
        reduce ? 0 : ms
      )
    );
  }


  /* =========================
     POSICIÓN
  ========================= */

  function centro(el){

    var a = el.getBoundingClientRect();
    var s = scene.getBoundingClientRect();

    return {
      x:a.left + a.width / 2 - s.left,
      y:a.top + a.height / 2 - s.top,
      w:a.width
    };

  }


  /* =========================
     CREAR EFECTO
  ========================= */

  function pieza(clase,x,y,w,keys,opt){

    var el = document.createElement('i');

    el.className = clase;

    el.style.cssText =
      'left:' + x + 'px;' +
      'top:' + y + 'px;' +
      'width:' + w + 'px;' +
      'height:' + w + 'px;' +
      'margin:' + (-w/2) + 'px 0 0 ' + (-w/2) + 'px;' +
      'opacity:0';

    fx.appendChild(el);

    var an = el.animate(keys,opt);

    an.onfinish = function(){
      el.remove();
    };

  }


  /* =========================
     CHISPAS
  ========================= */

  function chispas(x,y,n,radio,tam){

    /*
      Se mantiene el efecto original,
      pero se limita ligeramente la cantidad.
    */

    for(var k=0;k<n;k++){

      var ang =
        (Math.PI * 2 * k / n) +
        Math.random() * .5;

      var d =
        radio *
        (.55 + Math.random() * .6);

      var dx = Math.cos(ang) * d;

      var dy =
        Math.sin(ang) * d +
        radio * .15;

      var w =
        tam *
        (.5 + Math.random() * .9);

      var el =
        document.createElement('i');

      el.className = 'st';

      el.style.cssText =
        'left:' + x + 'px;' +
        'top:' + y + 'px;' +
        'width:' + w + 'px;' +
        'height:' + w + 'px;' +
        'margin:' + (-w/2) + 'px 0 0 ' + (-w/2) + 'px;' +
        '--c:' + colores[k % colores.length] + ';' +
        'opacity:0';

      fx.appendChild(el);

      var giro =
        (Math.random() * 180 - 90) +
        'deg';

      var an =
        el.animate(
          [
            {
              transform:
                'translate(0,0) scale(0) rotate(0deg)',
              opacity:1
            },
            {
              transform:
                'translate(' +
                dx*.7 +
                'px,' +
                dy*.7 +
                'px) scale(1.1) rotate(' +
                giro +
                ')',
              opacity:1,
              offset:.45
            },
            {
              transform:
                'translate(' +
                dx +
                'px,' +
                (dy + radio*.25) +
                'px) scale(0) rotate(' +
                giro +
                ')',
              opacity:0
            }
          ],
          {
            duration:
              900 + Math.random() * 700,

            easing:
              'cubic-bezier(.15,.7,.3,1)',

            delay:
              Math.random() * 120
          }
        );

      an.onfinish =
        (function(e){
          return function(){
            e.remove();
          };
        })(el);

    }

  }


  /* =========================
     DESTELLO
  ========================= */

  function destello(x,y,w){

    pieza(
      'fl',
      x,
      y,
      w,
      [
        {
          transform:'scale(.2)',
          opacity:1
        },
        {
          transform:'scale(9)',
          opacity:0
        }
      ],
      {
        duration:900,
        easing:'ease-out'
      }
    );


    for(var r=0;r<3;r++){

      pieza(
        'rg',
        x,
        y,
        w,
        [
          {
            transform:'scale(.6)',
            opacity:1
          },
          {
            transform:
              'scale(' +
              (8 + r * 3) +
              ')',
            opacity:0
          }
        ],
        {
          duration:
            1100 + r * 250,

          delay:
            r * 160,

          easing:
            'cubic-bezier(.2,.6,.3,1)'
        }
      );

    }

  }


  /* =========================
     FLASH
  ========================= */

  function flash(fuerza){

    flashElement.animate(
      [
        {
          opacity:fuerza
        },
        {
          opacity:0
        }
      ],
      {
        duration:700,
        easing:'ease-out'
      }
    );

  }


  /* =========================
     BRILLO DEL SELLO
  ========================= */

  function brillo(){

    if(reduce) return;

    var s = centro(seal);

    flash(.55);

    destello(
      s.x,
      s.y,
      s.w
    );

    /*
      Antes:
      70 + 36 partículas.

      Ahora:
      45 + 24.

      Visualmente sigue siendo muy similar,
      pero genera menos trabajo.
    */

    chispas(
      s.x,
      s.y,
      45,
      s.w * 5.2,
      s.w * .34
    );

    chispas(
      s.x,
      s.y,
      24,
      s.w * 2.6,
      s.w * .5
    );

    try{

      if(navigator.vibrate){
        navigator.vibrate(
          [30,40,30]
        );
      }

    }catch(e){}

  }


  /* =========================
     BRILLO DE CARTA
  ========================= */

  function brilloCarta(){

    if(reduce) return;

    var c = centro(card);

    flash(.4);

    destello(
      c.x,
      c.y,
      c.w * .2
    );

    chispas(
      c.x,
      c.y,
      35,
      c.w * 1.1,
      c.w * .09
    );

    chispas(
      c.x,
      c.y - c.w * .25,
      22,
      c.w * .8,
      c.w * .07
    );

    chispas(
      c.x,
      c.y + c.w * .25,
      22,
      c.w * .8,
      c.w * .07
    );

    brillar();

  }


  /* =========================
     BRILLOS CONTINUOS
  ========================= */

  function brillar(){

    clearInterval(timerTw);

    /*
      En lugar de crear constantemente
      partículas cada 170 ms,
      usamos 320 ms.
    */

    timerTw =
      setInterval(
        function(){

          /*
            Si la pestaña no está visible,
            no generamos efectos.
          */

          if(document.hidden){
            return;
          }

          var k =
            card.getBoundingClientRect();

          var s =
            scene.getBoundingClientRect();

          var w =
            k.width *
            (.035 + Math.random() * .055);

          var x =
            k.left -
            s.left +
            Math.random() * k.width;

          var y =
            k.top -
            s.top +
            Math.random() * k.height;

          pieza(
            'tw',
            x,
            y,
            w,
            [
              {
                transform:
                  'scale(0) rotate(0deg)',
                opacity:0
              },
              {
                transform:
                  'scale(1.2) rotate(45deg)',
                opacity:1,
                offset:.5
              },
              {
                transform:
                  'scale(0) rotate(90deg)',
                opacity:0
              }
            ],
            {
              duration:
                900 + Math.random() * 600,

              easing:'ease-in-out'
            }
          );

        },
        320
      );

  }


  /* =========================
     ABRIR
  ========================= */

  function abrir(){

    if(
      scene.classList.contains('open')
    ){
      return;
    }

    brillo();

    /*
      IMPORTANTE:
      La secuencia original se conserva.
    */

    scene.classList.add('open');

    later(
      function(){
        scene.classList.add('rise');
      },
      650
    );

    later(
      function(){
        scene.classList.add('reveal');
      },
      1900
    );

    later(
      brilloCarta,
      2800
    );

  }


  /* =========================
     CERRAR
  ========================= */

  function cerrar(){

    timers.forEach(clearTimeout);
    timers = [];

    clearInterval(timerTw);
    timerTw = null;

    /*
      Limpiamos únicamente partículas
      que todavía estén activas.
    */

    while(fx.firstChild){
      fx.firstChild.remove();
    }

    /*
      La secuencia de cierre original
      se mantiene.
    */

    scene.classList.remove('reveal');

    later(
      function(){
        scene.classList.remove('rise');
      },
      300
    );

    later(
      function(){
        scene.classList.remove('open');
      },
      1100
    );

  }


  /* =========================
     EVENTOS
  ========================= */

  seal.addEventListener(
    'click',
    abrir
  );

  envelope.addEventListener(
    'click',
    function(e){

      if(e.target !== seal){
        abrir();
      }

    }
  );

  closeButton.addEventListener(
    'click',
    cerrar
  );


  /* =========================
     PAUSAR EFECTOS EN SEGUNDO PLANO
  ========================= */

  document.addEventListener(
    'visibilitychange',
    function(){

      if(document.hidden){

        clearInterval(timerTw);

      }else if(
        scene.classList.contains('reveal') &&
        !reduce
      ){

        brillar();

      }

    }
  );


  /* =========================
     CUENTA REGRESIVA
  ========================= */

  /*
    29 de octubre de 2026,
    10h00 Ecuador (UTC-5)
  */

  var evento =
    Date.UTC(
      2026,
      9,
      29,
      15,
      0,
      0
    );

  var count =
    document.getElementById('count');

  var ahora =
    Date.now();

  var d =
    Math.ceil(
      (evento - ahora) /
      86400000
    );

  if(d > 1){

    count.innerHTML =
      'Faltan <b>' +
      d +
      '</b> días';

  }else if(d === 1){

    count.innerHTML =
      'Es <b>mañana</b>';

  }else if(
    evento - ahora >
    -6 * 3600000
  ){

    count.innerHTML =
      'Es <b>hoy</b>';

  }else{

    count.textContent =
      '¡Gracias por acompañarnos!';

  }

})();
</script>
